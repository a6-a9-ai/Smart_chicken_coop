CONFIG_GPIO=y

# Logging
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# PWM
CONFIG_PWM=y
CONFIG_PWM_LOG_LEVEL_INF=y

# BLE
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_DEVICE_NAME="smartChicken"

# I2C
CONFIG_I2C=y
CONFIG_CBPRINTF_FP_SUPPORT=y #handling float for special I2C, temporary
